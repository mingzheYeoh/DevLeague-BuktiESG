[project]
name = "buktiesg-ai-pipeline"
version = "0.1.0"
description = "BuktiESG AI pipeline: pure parsing and analysis functions without database or HTTP access."
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic>=2.9.0",
    "openpyxl>=3.1.0",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
