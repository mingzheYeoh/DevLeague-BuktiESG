[project]
name = "buktiesg-api"
version = "0.1.0"
description = "BuktiESG backend API — First Vertical Slice (Phase 1)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.3",
    "python-multipart>=0.0.12",
    "buktiesg-ai-pipeline",
    "argon2-cffi>=23.1.0",
    "pydantic[email]>=2.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
buktiesg-ai-pipeline = { path = "../packages/ai-pipeline", editable = true }
